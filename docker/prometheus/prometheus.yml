global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself — gives the metrics investigator something real to query
  # even before an application is wired up.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # pop's own actuator endpoint. `host.docker.internal` reaches the host from
  # inside the container on Docker Desktop (macOS/Windows).
  - job_name: pop
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: pop

  # The service under observation in the demo. Point this at your own app;
  # the metrics investigator matches on the `service` label.
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: order-service
